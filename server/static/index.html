<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JobPilot · Job Search</title>
<style>
  :root{
    --blue:#2557A7; --blue-dark:#164081; --blue-tint:#eaf0fb;
    --text:#2d2d2d; --muted:#595959; --subtle:#767676;
    --border:#d4d2d0; --divider:#e4e2e0; --bg:#ffffff; --panel:#f3f2f1;
    --green:#0a7e07; --amber:#9a6700; --grey:#6f6f6f; --ai:#6d28d9; --ai-tint:#f1ebfb;
    --radius:8px; --shadow:0 1px 6px rgba(0,0,0,.12);
    --font:"Noto Sans","Helvetica Neue",Helvetica,Arial,"Liberation Sans",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--panel);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45}
  a{color:var(--blue);text-decoration:none}
  a:hover{text-decoration:underline}
  button{font-family:var(--font);cursor:pointer}

  /* Header */
  header{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:18px;padding:10px 20px}
  .brand{font-size:22px;font-weight:800;color:var(--blue);letter-spacing:-.5px}
  .brand span{color:var(--text)}
  .health{display:flex;gap:14px;align-items:center;font-size:12px;color:var(--muted);margin-left:6px}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--grey);vertical-align:middle}
  .dot.up{background:var(--green)} .dot.down{background:#c0392b}
  .header-spacer{flex:1}
  .ghost-btn{background:transparent;border:1px solid var(--border);border-radius:var(--radius);padding:7px 12px;color:var(--text);font-weight:600}
  .ghost-btn:hover{background:var(--panel)}

  /* Search bar */
  .searchbar{position:sticky;top:53px;z-index:20;background:var(--bg);border-bottom:1px solid var(--border);padding:12px 20px}
  .search-wrap{display:flex;gap:0;max-width:1000px;border:1px solid var(--text);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;background:#fff}
  .field{display:flex;align-items:center;gap:8px;padding:10px 14px;flex:1}
  .field+.field{border-left:1px solid var(--divider)}
  .field svg{flex:none;opacity:.7}
  .field input{border:0;outline:0;font-size:15px;width:100%;color:var(--text)}
  .find{background:var(--blue);color:#fff;border:0;font-weight:700;font-size:15px;padding:0 22px}
  .find:hover{background:var(--blue-dark)}
  .toolbar{display:flex;align-items:center;gap:12px;max-width:1000px;margin-top:10px;color:var(--muted);font-size:13px}
  .toolbar select{font-family:var(--font);padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:#fff}

  /* Layout */
  main{display:grid;grid-template-columns:262px minmax(360px,1fr) minmax(380px,520px);gap:16px;
    align-items:start;padding:16px 20px;max-width:1500px}
  .rail{position:sticky;top:150px;max-height:calc(100vh - 165px);overflow:auto;background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px}
  .results{display:flex;flex-direction:column;gap:10px;min-width:0}
  .detail{position:sticky;top:150px;max-height:calc(100vh - 165px);overflow:auto;background:#fff;border:1px solid var(--border);border-radius:var(--radius)}

  /* Facets */
  .facet{margin-bottom:16px}
  .facet h4{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--subtle)}
  .opt{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:13px}
  .opt label{flex:1;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .opt .ct{color:var(--subtle);font-size:12px}
  .rail .clear{width:100%;margin-top:4px;background:var(--blue-tint);border:0;color:var(--blue-dark);font-weight:700;padding:8px;border-radius:6px}
  input[type=range]{width:100%}
  .toggle{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--ai)}

  /* Cards */
  .countbar{font-weight:700;font-size:15px;margin:2px 2px 0}
  .card{background:#fff;border:1px solid var(--border);border-left:4px solid transparent;border-radius:var(--radius);padding:14px 16px;cursor:pointer;transition:box-shadow .12s}
  .card:hover{box-shadow:var(--shadow)}
  .card.sel{border-left-color:var(--blue);background:#fafcff}
  .card .title{color:var(--blue);font-size:17px;font-weight:700;margin:0 0 2px}
  .card.sel .title{color:var(--blue-dark)}
  .card .co{font-size:14px;color:var(--text)}
  .card .loc{font-size:13px;color:var(--muted);margin-top:1px}
  .card .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
  .pill{font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;border:1px solid var(--border);color:var(--muted);background:#fff;white-space:nowrap}
  .pill.fit-strong{background:#e7f6e7;color:var(--green);border-color:#bfe3bf}
  .pill.fit-maybe{background:#fbf2e0;color:var(--amber);border-color:#ecd9ad}
  .pill.fit-stretch{background:#f1f1f1;color:var(--grey)}
  .pill.arch{background:var(--blue-tint);color:var(--blue-dark);border-color:#cfe0f7}
  .pill.ai{background:var(--ai-tint);color:var(--ai);border-color:#ddccf5}
  .pill.pay{background:#eef7ee;color:#226b22;border-color:#cfe6cf}
  .pill.status{background:#eef1f5;color:#3a4a63}
  .posted{color:var(--subtle);font-size:12px;margin-left:auto}
  .empty{padding:40px;text-align:center;color:var(--subtle)}

  /* Detail */
  .d-head{padding:18px 18px 12px;border-bottom:1px solid var(--divider)}
  .d-head h2{margin:0 0 4px;font-size:21px}
  .d-actions{display:flex;flex-wrap:wrap;gap:8px;padding:12px 18px;border-bottom:1px solid var(--divider)}
  .btn{background:var(--blue);color:#fff;border:0;border-radius:var(--radius);padding:9px 14px;font-weight:700}
  .btn:hover{background:var(--blue-dark)}
  .btn.sec{background:#fff;color:var(--blue);border:1px solid var(--blue)}
  .btn.sec:hover{background:var(--blue-tint)}
  .d-body{padding:16px 18px}
  .d-body h3{font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--subtle);margin:18px 0 8px}
  .dim{display:grid;grid-template-columns:130px 1fr 34px;gap:8px;align-items:center;margin:5px 0;font-size:13px}
  .bar{height:8px;background:var(--panel);border-radius:4px;overflow:hidden}
  .bar > i{display:block;height:100%;background:var(--blue)}
  .statusctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .statusctl select{padding:7px;border:1px solid var(--border);border-radius:6px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:var(--panel);border-radius:6px;padding:3px 8px;font-size:12px}
  .eval{white-space:pre-wrap;font-size:13.5px;background:var(--panel);border-radius:6px;padding:12px;max-height:340px;overflow:auto}
  .muted{color:var(--muted)}

  /* Insights */
  .insights{display:none;background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;margin:0 20px}
  .insights.open{display:block}
  .stat-grid{display:flex;flex-wrap:wrap;gap:18px}
  .stat{min-width:110px}
  .stat b{display:block;font-size:22px}
  .stat span{color:var(--subtle);font-size:12px}
  .funnel{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

  @media(max-width:1100px){
    main{grid-template-columns:1fr}
    .rail,.detail{position:static;max-height:none}
    .detail{order:3}
  }
</style>
</head>
<body>
<header>
  <div class="brand">Job<span>Pilot</span></div>
  <div class="health" id="health">
    <span><span class="dot" id="dot-dash"></span>Dashboard</span>
    <span><span class="dot" id="dot-ollama"></span>Ollama</span>
    <span id="lastUpdate" class="muted"></span>
  </div>
  <div class="header-spacer"></div>
  <button class="ghost-btn" id="insightsBtn">Insights</button>
</header>

<div class="searchbar">
  <div class="search-wrap">
    <div class="field">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      <input id="what" placeholder="Job title, keywords, or company" autocomplete="off" />
    </div>
    <div class="field">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.3-7-11a7 7 0 1114 0c0 4.7-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
      <input id="where" placeholder="City, state, or &quot;Remote&quot;" autocomplete="off" />
    </div>
    <button class="find" id="findBtn">Find jobs</button>
  </div>
  <div class="toolbar">
    <span id="resultCount"></span>
    <span class="header-spacer" style="flex:1"></span>
    <label>Sort:
      <select id="sort">
        <option value="relevance">Relevance</option>
        <option value="fit">Fit score</option>
        <option value="ai">AI-forward</option>
        <option value="date">Date posted</option>
        <option value="pay">Hourly pay</option>
      </select>
    </label>
  </div>
</div>

<div class="insights" id="insights"></div>

<main>
  <aside class="rail" id="rail"></aside>
  <section class="results" id="results"></section>
  <section class="detail" id="detail"><div class="empty">Select a job to see details.</div></section>
</main>

<script>
const AI_THRESHOLD = 60;
const state = {
  apps: [], stats: {}, archetypes: {},
  selectedId: null, lastTotal: -1,
  filters: { what:"", where:"", categories:new Set(), tiers:new Set(), aiForward:false,
             jobTypes:new Set(), sources:new Set(), statuses:new Set(), datePosted:"any", minScore:0 },
  sort: "relevance",
};

const $ = s => document.querySelector(s);
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function fitTier(s){ if(s==null) return null; if(s>=75) return "strong"; if(s>=60) return "maybe"; return "stretch"; }
function isAIForward(a){ return (a.ai_intensity!=null) && a.ai_intensity>=AI_THRESHOLD; }
function payLabel(a){
  if(a.pay_period==="hourly" && a.hourly_min!=null){
    const lo=Math.round(a.hourly_min), hi=a.hourly_max!=null?Math.round(a.hourly_max):lo;
    return hi>lo ? `$${lo}–$${hi}/hr` : `$${lo}/hr`;
  }
  if(a.salary_text) return a.salary_text;
  if(a.salary_min) return `$${Math.round(a.salary_min/1000)}k+`;
  return null;
}
function postedLabel(a){
  if(a.age_hours==null) return "";
  const h=a.age_hours; if(h<24) return "Today"; const d=Math.floor(h/24);
  return d<=1?"1 day ago":`${d} days ago`;
}
function dateOK(a){
  const dp=state.filters.datePosted; if(dp==="any") return true;
  if(a.age_hours==null) return false;
  return a.age_hours <= ({ "24h":24,"3d":72,"7d":168,"14d":336 }[dp]||1e9);
}

// Apply all active filters; optionally skip one facet (for live counts).
function filterApps(skip){
  const f=state.filters;
  const what=f.what.trim().toLowerCase(), where=f.where.trim().toLowerCase();
  return state.apps.filter(a=>{
    if(what){ const hay=`${a.title||""} ${a.company||""} ${(a.ats_keywords||[]).join(" ")}`.toLowerCase(); if(!hay.includes(what)) return false; }
    if(where){ const isRemoteQ=where.includes("remote"); const loc=(a.location||"").toLowerCase();
      if(isRemoteQ){ if(!(a.is_remote||loc.includes("remote"))) return false; } else if(!loc.includes(where)) return false; }
    if(skip!=="categories" && f.categories.size && !f.categories.has(a.archetype||"unknown")) return false;
    if(skip!=="tiers" && f.tiers.size && !f.tiers.has(fitTier(a.fit_score))) return false;
    if(skip!=="aiForward" && f.aiForward && !isAIForward(a)) return false;
    if(skip!=="jobTypes" && f.jobTypes.size && !f.jobTypes.has(a.employment_type||"unknown")) return false;
    if(skip!=="sources" && f.sources.size && !f.sources.has((a.source||"").split(":")[0])) return false;
    if(skip!=="statuses" && f.statuses.size && !f.statuses.has(a.status)) return false;
    if(skip!=="datePosted" && !dateOK(a)) return false;
    if(skip!=="minScore" && f.minScore>0 && (a.fit_score||0) < f.minScore) return false;
    return true;
  });
}
function sortApps(list){
  const by=state.sort, c=[...list];
  if(by==="fit") c.sort((a,b)=>(b.fit_score||0)-(a.fit_score||0));
  else if(by==="ai") c.sort((a,b)=>(b.ai_intensity||0)-(a.ai_intensity||0)||(b.fit_score||0)-(a.fit_score||0));
  else if(by==="date") c.sort((a,b)=>(a.age_hours??1e9)-(b.age_hours??1e9));
  else if(by==="pay") c.sort((a,b)=>((b.hourly_max||b.hourly_min||0))-((a.hourly_max||a.hourly_min||0)));
  else c.sort((a,b)=>(b.fit_score||0)-(a.fit_score||0));
  return c;
}

function countBy(skip, keyFn){
  const base=filterApps(skip); const m=new Map();
  for(const a of base){ const k=keyFn(a); if(k==null) continue; m.set(k,(m.get(k)||0)+1); }
  return m;
}

function checkboxFacet(title, key, options){
  let html=`<div class="facet"><h4>${esc(title)}</h4>`;
  const cmap = countBy(key, a=>{
    if(key==="categories") return a.archetype||"unknown";
    if(key==="jobTypes") return a.employment_type||"unknown";
    if(key==="sources") return (a.source||"").split(":")[0];
    if(key==="statuses") return a.status;
    if(key==="tiers") return fitTier(a.fit_score);
    return null;
  });
  for(const {val,label} of options){
    const ct=cmap.get(val)||0;
    const checked=state.filters[key].has(val)?"checked":"";
    html+=`<div class="opt"><input type="checkbox" id="f-${key}-${esc(val)}" data-facet="${key}" data-val="${esc(val)}" ${checked}/>
      <label for="f-${key}-${esc(val)}">${esc(label)}</label><span class="ct">${ct}</span></div>`;
  }
  html+=`</div>`; return html;
}

function uniqueOptions(getKey, getLabel){
  const seen=new Map();
  for(const a of state.apps){ const k=getKey(a); if(k==null||k==="") continue; if(!seen.has(k)) seen.set(k,getLabel(a,k)); }
  return [...seen.entries()].map(([val,label])=>({val,label})).sort((a,b)=>a.label.localeCompare(b.label));
}

function renderRail(){
  const catOpts=uniqueOptions(a=>a.archetype||"unknown", a=>a.archetype_label||"Unknown");
  const typeLabels={part_time:"Part-time",full_time:"Full-time",contract:"Contract",per_diem:"Per diem",unknown:"Unspecified"};
  const typeOpts=uniqueOptions(a=>a.employment_type||"unknown", (a,k)=>typeLabels[k]||k);
  const srcOpts=uniqueOptions(a=>(a.source||"").split(":")[0], (a,k)=>k.charAt(0).toUpperCase()+k.slice(1));
  const stOpts=uniqueOptions(a=>a.status, a=>(a.status_meta&&a.status_meta.label)||a.status);
  const tierOpts=[{val:"strong",label:"Strong (75+)"},{val:"maybe",label:"Maybe (60–74)"},{val:"stretch",label:"Stretch (<60)"}];
  const aiCt=filterApps("aiForward").filter(isAIForward).length;

  let html="";
  html+=`<div class="facet"><div class="opt toggle"><input type="checkbox" id="f-ai" ${state.filters.aiForward?"checked":""}/>
    <label for="f-ai">⚡ AI-forward only</label><span class="ct">${aiCt}</span></div></div>`;
  html+=checkboxFacet("Role category","categories",catOpts);
  html+=checkboxFacet("Fit tier","tiers",tierOpts);
  html+=checkboxFacet("Job type","jobTypes",typeOpts);
  html+=`<div class="facet"><h4>Date posted</h4>`;
  for(const [val,label] of [["any","Any time"],["24h","Last 24 hours"],["3d","Last 3 days"],["7d","Last 7 days"],["14d","Last 14 days"]]){
    html+=`<div class="opt"><input type="radio" name="dp" id="dp-${val}" data-dp="${val}" ${state.filters.datePosted===val?"checked":""}/>
      <label for="dp-${val}">${label}</label></div>`;
  }
  html+=`</div>`;
  html+=checkboxFacet("Source","sources",srcOpts);
  html+=checkboxFacet("Status","statuses",stOpts);
  html+=`<div class="facet"><h4>Min fit score: <span id="msLabel">${state.filters.minScore}</span></h4>
    <input type="range" id="ms" min="0" max="100" step="5" value="${state.filters.minScore}"/></div>`;
  html+=`<button class="clear" id="clearBtn">Clear all filters</button>`;
  $("#rail").innerHTML=html;

  $("#rail").querySelectorAll('input[type=checkbox][data-facet]').forEach(el=>{
    el.onchange=()=>{ const s=state.filters[el.dataset.facet]; el.checked?s.add(el.dataset.val):s.delete(el.dataset.val); render(); };
  });
  $("#f-ai").onchange=e=>{ state.filters.aiForward=e.target.checked; render(); };
  $("#rail").querySelectorAll('input[data-dp]').forEach(el=>el.onchange=()=>{ state.filters.datePosted=el.dataset.dp; render(); });
  $("#ms").oninput=e=>{ state.filters.minScore=+e.target.value; $("#msLabel").textContent=e.target.value; renderList(); };
  $("#clearBtn").onclick=()=>{ state.filters={ what:"",where:"",categories:new Set(),tiers:new Set(),aiForward:false,
    jobTypes:new Set(),sources:new Set(),statuses:new Set(),datePosted:"any",minScore:0 };
    $("#what").value="";$("#where").value=""; render(); };
}

function cardHTML(a){
  const tier=fitTier(a.fit_score), pay=payLabel(a);
  let pills="";
  if(a.fit_score!=null) pills+=`<span class="pill fit-${tier}">Fit ${a.fit_score}</span>`;
  if(a.archetype_label) pills+=`<span class="pill arch">${esc(a.archetype_label)}</span>`;
  if(isAIForward(a)) pills+=`<span class="pill ai">⚡ AI-forward</span>`;
  if(pay) pills+=`<span class="pill pay">${esc(pay)}</span>`;
  if(a.status_meta&&a.status_meta.label) pills+=`<span class="pill status">${esc(a.status_meta.label)}</span>`;
  return `<div class="card ${a.id===state.selectedId?"sel":""}" data-id="${a.id}">
    <p class="title">${esc(a.title||"Untitled")}</p>
    <div class="co">${esc(a.company||"")}</div>
    <div class="loc">${esc(a.location||"—")}</div>
    <div class="row">${pills}<span class="posted">${postedLabel(a)}</span></div>
  </div>`;
}

function renderList(){
  const list=sortApps(filterApps(null));
  $("#resultCount").textContent=`${list.length} of ${state.apps.length} jobs`;
  if(!list.length){ $("#results").innerHTML=`<div class="empty">No jobs match these filters.</div>`; return; }
  $("#results").innerHTML=`<div class="countbar">${list.length} jobs</div>`+list.map(cardHTML).join("");
  $("#results").querySelectorAll(".card").forEach(c=>c.onclick=()=>selectApp(+c.dataset.id));
}

const STATUSES=["found","scored","materials_ready","queued","approved","applied","response_received","interview","rejected","no_response","skipped"];
function selectApp(id){
  state.selectedId=id;
  const a=state.apps.find(x=>x.id===id); if(!a){ return; }
  renderList();
  const pay=payLabel(a);
  let head=`<div class="d-head"><h2>${esc(a.title||"")}</h2>
    <div class="co">${esc(a.company||"")} · ${esc(a.location||"—")}${pay?" · "+esc(pay):""}</div>
    <div class="row" style="margin-top:8px">
      ${a.fit_score!=null?`<span class="pill fit-${fitTier(a.fit_score)}">Fit ${a.fit_score}</span>`:""}
      ${a.archetype_label?`<span class="pill arch">${esc(a.archetype_label)}</span>`:""}
      ${isAIForward(a)?`<span class="pill ai">⚡ AI-forward ${a.ai_intensity}</span>`:""}
    </div></div>`;
  let actions=`<div class="d-actions">
    ${a.url?`<button class="btn" data-act="apply">Open / Apply ↗</button>`:""}
    ${a.has_tailored_cv?`<button class="btn sec" data-act="cv">Open résumé</button><a class="btn sec" href="/api/file/resume/${a.id}">Download résumé</a>`:""}
    ${a.has_cover_letter?`<a class="btn sec" href="/api/file/cover/${a.id}">Cover letter</a>`:""}
  </div>`;
  let body=`<div class="d-body">
    <div class="statusctl"><strong>Status:</strong>
      <select id="statusSel">${STATUSES.map(s=>`<option value="${s}" ${a.status===s?"selected":""}>${s.replace(/_/g," ")}</option>`).join("")}</select></div>`;
  if(a.ai_tools&&a.ai_tools.length) body+=`<h3>AI tooling</h3><div class="chips">${a.ai_tools.map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div>`;
  if(a.dimensions){ body+=`<h3>Fit dimensions</h3>`;
    for(const [k,v] of Object.entries(a.dimensions)){
      body+=`<div class="dim"><span>${esc(k.replace(/_/g," "))}</span><div class="bar"><i style="width:${Math.max(0,Math.min(100,v))}%"></i></div><span>${v}</span></div>`; } }
  if(a.key_matches&&a.key_matches.length) body+=`<h3>Key matches</h3><div class="chips">${a.key_matches.map(m=>`<span class="chip">✓ ${esc(m)}</span>`).join("")}</div>`;
  if(a.key_gaps&&a.key_gaps.length) body+=`<h3>Key gaps</h3><div class="chips">${a.key_gaps.map(m=>`<span class="chip">△ ${esc(m)}</span>`).join("")}</div>`;
  body+=`<h3>Evaluation</h3><div id="evalBox" class="muted">${a.has_evaluation?"Loading…":"No evaluation report for this job."}</div>`;
  if(a.description) body+=`<h3>Description</h3><div class="eval">${esc(a.description.slice(0,4000))}</div>`;
  body+=`</div>`;
  $("#detail").innerHTML=head+actions+body;
  $("#detail").scrollTop=0;

  const sel=$("#statusSel"); if(sel) sel.onchange=()=>changeStatus(id, sel.value);
  $("#detail").querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>doAction(b.dataset.act, id));
  if(a.has_evaluation) loadEval(id);
}

async function loadEval(id){
  try{ const r=await fetch(`/api/application/${id}/evaluation`); if(!r.ok) throw 0;
    const d=await r.json(); const box=$("#evalBox"); if(box){ box.className="eval"; box.textContent=d.markdown||""; }
  }catch(e){ const box=$("#evalBox"); if(box){ box.className="muted"; box.textContent="Evaluation unavailable."; } }
}
async function changeStatus(id, status){
  try{ await fetch(`/api/application/${id}/status`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({status})});
    const a=state.apps.find(x=>x.id===id); if(a){ a.status=status; } renderList();
  }catch(e){}
}
async function doAction(act, id){
  if(act==="apply") fetch(`/api/application/${id}/open-link`,{method:"POST"});
  if(act==="cv") fetch(`/api/application/${id}/open-cv`,{method:"POST"});
}

function renderInsights(){
  const s=state.stats, p=s.pipeline||{};
  const aiCount=state.apps.filter(isAIForward).length;
  const btCount=state.apps.filter(a=>a.archetype==="behavioral_technician").length;
  const order=[["found","Found"],["scored","Scored"],["materials_ready","Materials"],["queued","Queued"],["applied","Applied"],["interview","Interview"],["rejected","Rejected"]];
  $("#insights").innerHTML=`<div class="stat-grid">
    <div class="stat"><b>${s.total_jobs??"—"}</b><span>Total jobs</span></div>
    <div class="stat"><b>${s.jobs_this_week??"—"}</b><span>This week</span></div>
    <div class="stat"><b>${s.avg_score??"—"}</b><span>Avg fit</span></div>
    <div class="stat"><b>${s.high_matches??"—"}</b><span>Fit 80+</span></div>
    <div class="stat"><b>${aiCount}</b><span>⚡ AI-forward</span></div>
    <div class="stat"><b>${btCount}</b><span>Behavioral Tech</span></div>
    <div class="stat"><b>${p.applied??0}</b><span>Applied</span></div>
  </div><div class="funnel">${order.map(([k,l])=>`<span class="pill">${l}: ${p[k]??0}</span>`).join("")}</div>`;
}

function render(){ renderRail(); renderList(); renderInsights(); }

function setLastUpdate(){ $("#lastUpdate").textContent="updated "+new Date().toLocaleTimeString(); }

async function loadAll(){
  try{
    const [stats, apps, arch] = await Promise.all([
      fetch("/api/stats").then(r=>r.json()),
      fetch("/api/applications?limit=500").then(r=>r.json()),
      fetch("/api/archetypes").then(r=>r.json()).catch(()=>({})),
    ]);
    state.stats=stats; state.apps=apps; state.archetypes=arch; state.lastTotal=stats.total_jobs;
    $("#dot-dash").className="dot up"; $("#dot-ollama").className="dot up";
    setLastUpdate(); render();
  }catch(e){ $("#dot-dash").className="dot down"; $("#results").innerHTML=`<div class="empty">Could not load data: ${esc(e.message||e)}</div>`; }
}

function connectSSE(){
  try{
    const es=new EventSource("/api/stream");
    es.onmessage=ev=>{
      let d; try{ d=JSON.parse(ev.data); }catch(_){ return; }
      if(d.type==="stats"){ state.stats=d.payload; setLastUpdate(); renderInsights();
        if(d.payload.total_jobs!==state.lastTotal){ state.lastTotal=d.payload.total_jobs;
          fetch("/api/applications?limit=500").then(r=>r.json()).then(a=>{ state.apps=a; render(); if(state.selectedId) selectApp(state.selectedId); }); } }
    };
    es.onerror=()=>{};
  }catch(e){}
}

$("#findBtn").onclick=()=>{ state.filters.what=$("#what").value; state.filters.where=$("#where").value; render(); };
$("#what").addEventListener("keyup",e=>{ if(e.key==="Enter"){ state.filters.what=$("#what").value; render(); } });
$("#where").addEventListener("keyup",e=>{ if(e.key==="Enter"){ state.filters.where=$("#where").value; render(); } });
$("#sort").onchange=e=>{ state.sort=e.target.value; renderList(); };
$("#insightsBtn").onclick=()=>$("#insights").classList.toggle("open");

loadAll(); connectSSE();
</script>
</body>
</html>
