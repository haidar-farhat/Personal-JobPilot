    # search page with the generic Playwright scanner instead.
    career_url: "https://www.kaiserpermanentejobs.org/search-jobs/data%20analyst/California/"
    ats_platform: "custom"
    location: "Oakland, CA"
    priority: high
    search_params:
      keywords: "data analyst"
      location: "Oakland"

