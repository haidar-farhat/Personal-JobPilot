# JobPilot Configuration
# =====================

# Job search parameters
search:
  keywords:
    - "Data Analyst"
    - "Data Scientist"
    - "Junior Data Scientist"
    - "Junior Data Analyst"
    - "Analytics Analyst"
    - "Business Analyst"
    - "Quantitative Analyst"
    - "Data Science Intern"
    - "Data Analyst Intern"
    - "Entry Level Data Scientist"
    - "Entry Level Data Analyst"
    # --- AI-engineering track (2026-06-29) ---
    - "AI Engineer"
    - "LLM Engineer"
    - "Generative AI Engineer"
    - "Applied AI Engineer"
    - "Prompt Engineer"
    - "Machine Learning Engineer"
    - "ML Engineer"
    - "Solutions Engineer"
    - "Forward Deployed Engineer"
    - "AI Solutions Engineer"
    - "Sales Engineer"
    - "AI Analyst"
    - "Applied Scientist"
    # --- Behavioral Technician track (2026-06-29) ---
    - "Behavioral Technician"
    - "Behavior Technician"
    - "Registered Behavior Technician"
    - "RBT"
    - "ABA Therapist"
    - "Behavior Interventionist"
    - "Behavior Therapist"

  locations:
    - "San Francisco, CA"
    - "Oakland, CA"
    - "San Jose, CA"
    - "Berkeley, CA"
    - "Bay Area"
    - "Remote"

  # Maximum years of experience to filter (skip jobs requiring more)
  max_experience_years: 5

  # Keywords in title that mean auto-skip
  excluded_title_keywords:
    - "Senior Staff"
    - "Staff"
    - "Principal"
    - "Director"
    - "VP"
    - "Vice President"
    - "Lead"
    - "Manager"
    - "Head of"

# Scoring thresholds
scoring:
  auto_queue_threshold: 60    # Score >= 60 → auto-generate materials
  maybe_threshold: 40          # Score 40-59 → "maybe" list
  skip_threshold: 40           # Score < 40 → auto-skip

# Compensation floors (hourly) — BT track scoring + auto-apply guardrail
comp:
  min_hourly_by_archetype:
    behavioral_technician: 30   # never auto-apply a BT role known to pay < $30/hr

# AI-forward signal — ranker emits ai_intensity (0-100) per job
ai_intensity:
  badge_threshold: 60           # jobs scoring >= this show the ⚡ AI-forward badge / filter

# Schedule (24-hour format, local time)
schedule:
  active_hours:
    start: 7    # 7 AM
    end: 22     # 10 PM

  intervals:
    # Single ATS-API sweep (Greenhouse + Lever + Ashby) — every 30 minutes
    career_pages_scan_minutes: 30

# Ollama configuration
ollama:
  base_url: "http://localhost:11434"
  model: "gemma4:31b"
  timeout: 120  # seconds

# Dashboard configuration
dashboard:
  port: 7777            # Not 3000 — reserved for trading bot
  host: "127.0.0.1"
  auto_open_browser: true

# Notifications
notifications:
  enabled: true
  high_score_threshold: 80    # Notify for jobs scoring 80+
  daily_summary_hour: 8       # 8 AM daily summary

# Output paths
output:
  resumes_dir: "output/resumes"
  cover_letters_dir: "output/cover_letters"
  database_path: "jobpilot.db"

# User info (for cover letters and applications)
user:
  name: "Matthew Cromaz"
  email: "matthewcromaz37@gmail.com"
  phone: "415-745-5603"
  linkedin: "linkedin.com/in/matthew-cromaz"
  github: "github.com/TheCromazone"
  location: "San Francisco, CA"
