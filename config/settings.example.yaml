# Scoring thresholds
scoring:
  auto_queue_threshold: 60    # Score >= 60 → auto-generate materials
  maybe_threshold: 40          # Score 40-59 → "maybe" list
  skip_threshold: 40           # Score < 40 → auto-skip
  # Jobs scored per 15-min ranking cycle. Raised from a hardcoded 20 on
  # 2026-08-03 when the scanners' Bay-Area filter was removed and intake grew
  # ~5x. Each job is 2-3 Ollama calls (~18s), so keep this under ~45 or the
  # cycle overruns its interval.
  rank_batch_size: 40

# Compensation floors — scoring + auto-apply guardrail
comp:
  min_hourly_by_archetype:
    behavioral_technician: 30   # never auto-apply a BT role known to pay < $30/hr

  # Full-time salary floor for the tech track (2026-08-03). This is the
  # "can I afford to live alone" number: $85k clears a 1BR (~$1.4-1.7k/mo) in
  # Austin / Phoenix / Vegas / Nashville with room to save. Fed to the ranker's
  # comp_range prompt, which judges pay against the POSTING'S metro rather
  # than against SF norms — $95k in Tucson beats $130k in SF on take-home.
  # Jobs below this are scored down, not hard-filtered (many strong postings
  # don't disclose salary at all).
  min_annual_full_time: 85000

# AI-forward signal — ranker emits ai_intensity (0-100) per job
ai_intensity:
  badge_threshold: 60           # jobs scoring >= this show the ⚡ AI-forward badge / filter

# Schedule (24-hour format, local time)
schedule:
  active_hours:
    start: 7    # 7 AM
    end: 22     # 10 PM

  intervals:
    # Single ATS-API sweep (Greenhouse + Lever + Ashby) — every 30 minutes
    career_pages_scan_minutes: 30

# Ollama configuration
ollama:
  base_url: "http://localhost:11434"
  # This machine has gemma4:latest and gemma4:31b pulled (2026-07-05). If the
  # configured model isn't installed, the client falls back to the closest
  # available one instead of silently failing every LLM call.
  model: "gemma4:latest"
  num_ctx: 16384        # long JDs + resume summary would truncate at ollama's 4096 default
  timeout: 120  # seconds

# Which LLM serves JobPilot (autofill essays, cover letters, tailoring,
# ranking — everything routes through utils/ollama_client.py).
#   provider "openai": a configured model via the official API. This can be
#     faster than local inference, but it is a paid network call. It needs the
#     OPENAI_API_KEY env var; set once with
#       setx OPENAI_API_KEY sk-...   (then restart JobPilot)
#     Never put the key in this file (it's git-tracked). Missing key or a
#     failed call falls back to local Ollama automatically.
#   provider "ollama": local gemma4 (free, slower). This is the default.
#     Cloud fallback is disabled even if a key happens to be present; opt in
#     explicitly with allow_openai_fallback: true.
# NOTE: a ChatGPT Plus subscription does NOT cover API calls — the key is
# separate pay-per-token billing at platform.openai.com. Routing Plus OAuth
# tokens into the API is unsupported/ToS-risky; if OpenAI ever ships
# subscription OAuth for the API, only the key source changes.
#   provider "anthropic": Claude via the official SDK (added 2026-09-01). Paid;
#     key from the ANTHROPIC_API_KEY env var only (setx ANTHROPIC_API_KEY sk-ant-...).
#     Default model is Claude Fable 5.1; anthropic_effort low|medium|high|xhigh|max
#     trades reasoning depth for cost. Same rule as OpenAI: a key alone is not
#     permission — opt into outage fallback with allow_anthropic_fallback: true.
llm:
  provider: "ollama"
  allow_openai_fallback: false
  openai_model: "gpt-5.6-terra"
  openai_timeout: 120
  allow_anthropic_fallback: false
  anthropic_model: "claude-fable-5-1"
  anthropic_effort: "medium"
  anthropic_timeout: 180

# Dashboard configuration
dashboard:
  port: 7777            # Not 3000 — reserved for trading bot
  host: "127.0.0.1"
  auto_open_browser: true

# Google Sheets application tracker — sync applied jobs to your tracker sheet.
# Auth: service account. Put the service-account JSON key at credentials_path
# (gitignored) and share the sheet with the service account's email as Editor.
google_sheets:
  enabled: true
  spreadsheet_id: "1ljhaUbcWmiPgejBcz43OdNy4vJCxtR5ZpE_manKd-80"
  worksheet: ""                                  # "" = first worksheet/tab
  credentials_path: "config/google_credentials.json"

# Tailor / resume-optimizer (hiring-agent-style JD-relative audit)
tailor:
  cover_letter_default: true   # dashboard/extension default; per run: POST …/tailor?cover_letter=0
  attach_format: pdf           # what autofill attaches when the tailor made a Word-verified PDF: pdf | docx
  optimizer:
    enabled: true
    min_score: 75      # regenerate once with feedback when the audit scores below this
    max_retries: 1

# Gmail connector (read-only IMAP) lives in config/gmail.yaml — see config/gmail.example.yaml.

# Notifications
notifications:
  enabled: true
  high_score_threshold: 80    # Notify for jobs scoring 80+
  daily_summary_hour: 8       # 8 AM daily summary

# Output paths
output:
  resumes_dir: "output/resumes"
  cover_letters_dir: "output/cover_letters"
  database_path: "jobpilot.db"

# User info (for cover letters and applications)
user:
  name: "Your Name"
  email: "you@example.com"
  phone: "555-0142"
  linkedin: "linkedin.com/in/your-handle"
  github: "github.com/your-handle"
  location: "San Francisco, CA"

mail:
  enabled: true
  to: ""                # force ONE recipient for every application (rarely wanted)

  # Send yourself a copy when the employer publishes no address. Off: mailing
  # your own inbox is not an application, and the ATS form already carried the
  # résumé. Turn on only if you want an archive of what went out.
  self_copy: false

  # Email the EMPLOYER. Recipient is resolved most-trustworthy-first:
  #   1. an address printed in the stored job description
  #   2. an address on the live job page (most descriptions are empty)
  #   3. an address published on the company's own site  (lookup_website)
  #   4. a constructed role address, e.g. careers@domain (guess_addresses)
  # Screened at every stage: accommodation / compliance / legal / no-reply
  # inboxes are never used.
  to_employer: true

  # (3) Crawl the company site - homepage, /careers, /jobs, /contact, /about -
  # and take a published recruiting address. Free, no API key. Most ATS-using
  # companies publish nothing, so expect this to miss often; that is correct
  # behaviour, not a failure.
  lookup_website: true

  # (4) Construct careers@domain when nothing is published. OFF by default and
  # deliberately so: an MX record proves the DOMAIN takes mail, never that the
  # MAILBOX exists, so some of these bounce. Guards in place - the domain must
  # be provably the company's (its homepage must name them), the address must
  # not be one a previous send bounced from, and sends are capped per day.
  # Preview what it WOULD send with GET /api/application/{id}/recipient before
  # switching this on.
  guess_addresses: false
  guess_locals: ["careers", "jobs", "recruiting", "talent", "hr"]
  max_guessed_per_day: 20   # cap on constructed addresses only; published ones uncapped
