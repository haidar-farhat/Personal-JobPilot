# Job Archetypes — borrowed from career-ops's archetype-routed scoring.
# Each archetype gets its own scoring weights so a Data Analyst role and an
# ML Engineer role aren't judged by the same rubric.
#
# Used by agents/ranker.py:
#   1. _classify_archetype(job)   → picks one of these keys
#   2. _score_dimensions(job, archetype) → uses that archetype's weights
#
# Weights MUST sum to 1.0 within each archetype. Validated on load.

# 10 scoring dimensions, scored 0-100 by the LLM
dimensions:
  - technical_fit       # tooling/languages overlap with JD requirements
  - level_match         # is this entry-level/IC1-IC2? (Matthew is junior)
  - comp_range          # enough to live alone in the JOB'S metro (not SF-anchored)
  - location_remote     # US-remote or an affordable target metro? (2026-08-03 relocation pivot)
  - archetype_fit       # does the role align with this archetype's core work
  - skills_overlap      # specific skill keywords from JD found in CV
  - growth_signal       # does the role offer learning trajectory
  - company_reputation  # is the company known/respected/profitable
  - ats_keyword_density # density of ATS-friendly keywords in JD vs CV
  - gap_severity        # how big are the gaps (INVERSE — high score = small gaps)

# Default fallback weights (used if archetype detection fails)
default_weights:
  technical_fit:       0.20
  level_match:         0.15
  comp_range:          0.10
  location_remote:     0.10
  archetype_fit:       0.10
  skills_overlap:      0.10
  growth_signal:       0.05
  company_reputation:  0.05
  ats_keyword_density: 0.05
  gap_severity:        0.10

# Per-archetype configurations
archetypes:

  data_analyst:
    label: "Data Analyst"
    description: "SQL-heavy, dashboard-driven, stakeholder-facing analytics. Tableau, Looker, Excel, basic Python."
    keywords: ["data analyst", "business analyst", "analytics analyst", "reporting analyst", "bi analyst", "insights analyst"]
    auto_apply_min_score: 72   # we're picky-but-not-stingy here, this is his sweet spot
    weights:
      technical_fit:       0.18
      level_match:         0.18   # critical — must be junior/IC1
      comp_range:          0.10
      location_remote:     0.10
      archetype_fit:       0.12
      skills_overlap:      0.12   # SQL/Tableau presence matters
      growth_signal:       0.05
      company_reputation:  0.05
      ats_keyword_density: 0.05
      gap_severity:        0.05

  data_scientist:
    label: "Data Scientist"
    description: "Statistical modeling, experimentation, A/B testing, Python/R, some ML."
    keywords: ["data scientist", "junior data scientist", "applied scientist", "decision scientist", "product data scientist"]
    auto_apply_min_score: 75
    weights:
      technical_fit:       0.20   # Python/R/stats core
      level_match:         0.18   # senior/staff DS = mismatch
      comp_range:          0.08
      location_remote:     0.08
      archetype_fit:       0.12
      skills_overlap:      0.12
      growth_signal:       0.06
      company_reputation:  0.05
      ats_keyword_density: 0.05
      gap_severity:        0.06

  quantitative_analyst:
    label: "Quantitative Analyst"
    description: "Econometrics, financial modeling, time-series, statistical inference. Strong fit for Matthew's MS."
    keywords: ["quantitative analyst", "quant analyst", "quantitative researcher", "econometrician", "research analyst"]
    auto_apply_min_score: 73   # MS Quant Econ → bonus zone
    weights:
      technical_fit:       0.18
      level_match:         0.15
      comp_range:          0.10
      location_remote:     0.08
      archetype_fit:       0.18   # archetype alignment is the headline match
      skills_overlap:      0.12
      growth_signal:       0.05
      company_reputation:  0.05
      ats_keyword_density: 0.04
      gap_severity:        0.05

  ml_engineer:
    label: "ML Engineer"
    description: "Production ML, MLOps, model serving, training pipelines. Distinct from ai_engineer (which is LLM/GenAI application work)."
    keywords: ["machine learning engineer", "ml engineer", "mlops engineer", "ml platform engineer", "model deployment engineer", "ml ops engineer"]
    auto_apply_min_score: 80   # be picky — gap is bigger here
    weights:
      technical_fit:       0.22   # heavier weight, gap more visible
      level_match:         0.15
      comp_range:          0.08
      location_remote:     0.08
      archetype_fit:       0.10
      skills_overlap:      0.12
      growth_signal:       0.05
      company_reputation:  0.05
      ats_keyword_density: 0.05
      gap_severity:        0.10   # bigger penalty for big gaps

  business_analyst:
    label: "Business Analyst"
    description: "Operational analysis, requirements gathering, less technical. Some SQL, lots of stakeholder mgmt."
    keywords: ["business analyst", "operations analyst", "strategy analyst", "business intelligence analyst"]
    auto_apply_min_score: 70
    weights:
      technical_fit:       0.12
      level_match:         0.18
      comp_range:          0.10
      location_remote:     0.10
      archetype_fit:       0.12
      skills_overlap:      0.10
      growth_signal:       0.08
      company_reputation:  0.08
      ats_keyword_density: 0.07
      gap_severity:        0.05

  product_analyst:
    label: "Product Analyst"
    description: "Product metrics, growth experimentation, funnel analysis, dashboards. Product-team-embedded."
    keywords: ["product analyst", "growth analyst", "experimentation analyst", "product data analyst"]
    auto_apply_min_score: 73
    weights:
      technical_fit:       0.16
      level_match:         0.18
      comp_range:          0.10
      location_remote:     0.08
      archetype_fit:       0.12
      skills_overlap:      0.12
      growth_signal:       0.06
      company_reputation:  0.06
      ats_keyword_density: 0.06
      gap_severity:        0.06

  ai_engineer:
    label: "AI Engineer"
    description: "Builds LLM/GenAI/agentic applications — prompt engineering, RAG, tool-use/agents, model integration via Claude/OpenAI APIs or local LLMs. Matthew's headline strength."
    keywords: ["ai engineer", "a.i. engineer", "llm engineer", "generative ai engineer", "genai engineer", "applied ai engineer", "applied ai", "prompt engineer", "agent engineer", "ai developer", "llm developer", "ai software engineer"]
    auto_apply_min_score: 76
    weights:
      technical_fit:       0.18
      level_match:         0.15
      comp_range:          0.08
      location_remote:     0.08
      archetype_fit:       0.16
      skills_overlap:      0.15
      growth_signal:       0.06
      company_reputation:  0.05
      ats_keyword_density: 0.04
      gap_severity:        0.05

  ai_solutions_engineer:
    label: "AI / Solutions Engineer"
    description: "Customer-facing technical role deploying AI/software solutions — solutions engineering, forward-deployed engineering, sales/customer engineering, implementation. Blends coding with client communication."
    keywords: ["solutions engineer", "forward deployed engineer", "forward-deployed", "fde", "ai solutions engineer", "ai solutions architect", "solutions architect", "sales engineer", "customer engineer", "implementation engineer", "deployment engineer", "field engineer"]
    auto_apply_min_score: 74
    weights:
      technical_fit:       0.16
      level_match:         0.14
      comp_range:          0.08
      location_remote:     0.08
      archetype_fit:       0.16
      skills_overlap:      0.14
      growth_signal:       0.08
      company_reputation:  0.06
      ats_keyword_density: 0.05
      gap_severity:        0.05

  ai_analyst:
    label: "AI Analyst"
    description: "AI-augmented analytics — analyst/DS work centered on using AI/LLM tooling day-to-day (AI analyst, generative-AI analyst, AI operations/research analyst)."
    keywords: ["ai analyst", "a.i. analyst", "ai data analyst", "generative ai analyst", "ai operations analyst", "ai research analyst", "ai/ml analyst"]
    auto_apply_min_score: 72
    weights:
      technical_fit:       0.16
      level_match:         0.17
      comp_range:          0.09
      location_remote:     0.09
      archetype_fit:       0.13
      skills_overlap:      0.13
      growth_signal:       0.06
      company_reputation:  0.05
      ats_keyword_density: 0.06
      gap_severity:        0.06

  behavioral_technician:
    label: "Behavioral Technician (ABA)"
    description: "Part-time or full-time ABA behavioral technician / RBT / behavior interventionist — 1:1 client sessions, data collection, treatment-plan implementation. Hourly pay and location are the dominant fit drivers (target ≥ $30/hr, SF/Bay)."
    keywords: ["behavioral technician", "behavior technician", "registered behavior technician", "rbt", "aba therapist", "behavior interventionist", "behavior therapist", "applied behavior analysis", "behavioral health technician", "1:1 aba", "behavior aide", "paraprofessional"]
    auto_apply_min_score: 70
    weights:
      technical_fit:       0.06
      level_match:         0.10
      comp_range:          0.20
      location_remote:     0.16
      archetype_fit:       0.16
      skills_overlap:      0.14
      growth_signal:       0.04
      company_reputation:  0.04
      ats_keyword_density: 0.04
      gap_severity:        0.06

  unknown:
    label: "Unknown / Other"
    description: "Could not confidently classify. Use default weights and score conservatively."
    keywords: []
    auto_apply_min_score: 80   # higher bar when we're unsure
    weights:                   # mirrors default_weights
      technical_fit:       0.20
      level_match:         0.15
      comp_range:          0.10
      location_remote:     0.10
      archetype_fit:       0.10
      skills_overlap:      0.10
      growth_signal:       0.05
      company_reputation:  0.05
      ats_keyword_density: 0.05
      gap_severity:        0.10
